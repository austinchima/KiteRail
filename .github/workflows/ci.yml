name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiterail
          POSTGRES_PASSWORD: kiterail
          POSTGRES_DB: kiterail
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Set up sqlc
        run: |
          curl -fsSL -o /tmp/sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          tar -xzf /tmp/sqlc.tar.gz -C /tmp
          sudo install -m 0755 /tmp/sqlc /usr/local/bin/sqlc
          sqlc version

      - name: Verify generated DB code is fresh
        run: |
          sqlc diff

      - name: gofmt (must be clean; *.go is eol=lf per .gitattributes)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: backend

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          work-dir: backend
          go-package: ./...

      - name: Test
        env:
          KITERAIL_POSTGRES_DSN: postgres://kiterail:kiterail@localhost:5432/kiterail?sslmode=disable
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Build
        run: go build -o /dev/null ./cmd/...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  policy:
    name: Policy Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Check policies (strict, catches conflicts & unused vars)
        run: opa check --strict policies/
      - name: Run policy unit tests
        run: opa test policies/ tests/policies/ -v
      - name: Smoke-eval quickstart payload (must not error, must quarantine)
        run: |
          echo '{"tool": "stripe.charge.refund", "arguments": {"amount": 1500}, "agent": "ci"}' > /tmp/in.json
          action=$(opa eval -d policies/ -i /tmp/in.json --format=values "data.kiterail.authz.decision" | jq -r '.[0].action')
          test "$action" = "quarantine" || { echo "expected quarantine, got: $action"; exit 1; }
