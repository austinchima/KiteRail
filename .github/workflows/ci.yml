name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kiterail
          POSTGRES_PASSWORD: kiterail
          POSTGRES_DB: kiterail
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: 'v1.31.1'

      - name: Verify generated DB code is fresh
        run: |
          sqlc generate
          git diff --exit-code -- internal/db

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          KITERAIL_POSTGRES_DSN: postgres://kiterail:kiterail@localhost:5432/kiterail?sslmode=disable
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /dev/null ./cmd/...

  dashboard:
    name: Dashboard Type-Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build

  policy:
    name: Policy Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Check policies (strict, catches conflicts & unused vars)
        run: opa check --strict policies/
      - name: Run policy unit tests
        run: opa test policies/ tests/policies/ -v
      - name: Smoke-eval quickstart payload (must not error, must quarantine)
        run: |
          echo '{"tool": "stripe.charge.refund", "arguments": {"amount": 1500}, "agent": "ci"}' > /tmp/in.json
          action=$(opa eval -d policies/ -i /tmp/in.json --format=values "data.kiterail.authz.decision" | jq -r '.[0].action')
          test "$action" = "quarantine" || { echo "expected quarantine, got: $action"; exit 1; }