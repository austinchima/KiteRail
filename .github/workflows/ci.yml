name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read

jobs:
  test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: elodea
          POSTGRES_PASSWORD: elodea
          POSTGRES_DB: elodea
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Set up sqlc
        run: |
          curl -fsSL -o /tmp/sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          tar -xzf /tmp/sqlc.tar.gz -C /tmp
          sudo install -m 0755 /tmp/sqlc /usr/local/bin/sqlc
          sqlc version

      - name: Verify generated DB code is fresh
        run: |
          sqlc diff

      - name: gofmt (must be clean; *.go is eol=lf per .gitattributes)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: backend

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          work-dir: backend
          go-package: ./...

      - name: Test
        env:
          ELODEA_POSTGRES_DSN: postgres://elodea:elodea@localhost:5432/elodea?sslmode=disable
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Build
        run: go build -o /dev/null ./cmd/...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  policy:
    name: Policy Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.21.1
      - name: Check policies (strict, catches conflicts & unused vars)
        run: opa check --strict policies/ tests/policies/ docs/policy-cookbook/
      - name: Run policy unit tests
        run: opa test policies/ tests/policies/ -v
      - name: Smoke-eval quickstart payload (must not error, must quarantine)
        run: |
          echo '{"tool": "stripe.charge.refund", "arguments": {"amount": 1500}, "agent": "ci"}' > /tmp/in.json
          action=$(opa eval -d policies/ -i /tmp/in.json --format=values "data.elodea.authz.decision" | jq -r '.[0].action')
          test "$action" = "quarantine" || { echo "expected quarantine, got: $action"; exit 1; }

  image:
    name: Container Image Build & Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: elodea:ci
          build-args: VERSION=ci-${{ github.sha }}
      - name: Image healthcheck binary works
        run: docker run --rm --entrypoint /usr/local/bin/elodea elodea:ci -h 2>&1 | grep -q healthcheck
      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: elodea:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  helm:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Lint (strict) and render
        run: |
          helm lint deploy/helm/elodea -f deploy/helm/elodea/ci/test-values.yaml --strict
          helm template ci deploy/helm/elodea -f deploy/helm/elodea/ci/test-values.yaml > /dev/null
