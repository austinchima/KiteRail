# Elodea Configuration

listen_addr: ":8080"

# Target API URL (e.g., your actual internal service)
target_url: "http://localhost:8081"

# Directory containing OPA Rego policies
policy_dir: "./policies"

# PostgreSQL connection string
postgres_dsn: "postgres://postgres:postgres@localhost:5432/elodea?sslmode=disable"

# development | production (production enforces strict startup validation:
# no sk_dev_ credentials, TLS required, no local sslmode=disable DSN)
environment: "development"

# --- Trust domains: NEVER share tokens across roles ---
# Machine clients invoking tools through the proxy.
api_keys:
  "sk_agent_example_0000000000000000": "agent_alpha"
  "sk_agent_example_1111111111111111": "agent_beta"

# Human reviewers: approve/deny quarantined actions, read ledger & dashboard.
reviewer_api_keys:
  "sk_reviewer_example_000000000000": "reviewer_jane"

# Admins: policy lifecycle (policies are read-only via API in v1.0).
admin_api_keys: {}

# Per-agent rate limiting
rate_limit_rps: 10
rate_limit_burst: 20

# HTTP server timeouts
read_timeout: 10s
read_header_timeout: 5s
write_timeout: 30s
idle_timeout: 120s
# Time /readyz stays false before the server closes the listener on SIGTERM.
shutdown_drain_delay: 5s

# Postgres pool
pg_max_open_conns: 25
pg_max_idle_conns: 5
pg_conn_max_lifetime: 30m

# Optional ingress TLS termination (required in production unless an
# identity-aware proxy in front handles TLS)
# tls_cert_file: "/certs/tls.crt"
# tls_key_file: "/certs/tls.key"

# Upstream service credential is loaded from the environment only:
#   ELODEA_TARGET_AUTH_TOKEN

# Single sign-on for reviewers and admins (optional). The client secret comes
# from ELODEA_OIDC_CLIENT_SECRET or ELODEA_OIDC_CLIENT_SECRET_FILE, never YAML.
# oidc:
#   issuer: https://example.okta.com
#   client_id: 0oa1b2c3d4
#   redirect_url: https://elodea.example.com/auth/callback
#   provider_name: Okta
#   scopes: [openid, email, profile, groups]
#   reviewer_groups: [treasury-reviewers]
#   admin_groups: [elodea-admins]
#   session_ttl: 8h
#   session_idle_ttl: 1h

# Held-action notifications (optional). Slack's webhook URL and the webhook
# signing secret are credentials: set them with ELODEA_NOTIFY_SLACK_WEBHOOK_URL
# and ELODEA_NOTIFY_WEBHOOK_SECRET (or their _FILE variants), never YAML.
# console_url: https://elodea-console.example.com
# notify:
#   webhook_url: https://hooks.example.com/elodea

# Approve or deny held actions from Slack (optional). The bot token and
# signing secret come from ELODEA_SLACK_BOT_TOKEN and
# ELODEA_SLACK_SIGNING_SECRET (or their _FILE variants), never YAML.
# Create the Slack app from deploy/slack/manifest.yaml.
# slack:
#   channel_id: C0123456789
#   team_id: T0123456789
#   reviewers: [priya@example.com]
