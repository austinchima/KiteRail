version: "2"
sql:
  - engine: "postgresql"
    schema: "sql/schema.sql"
    queries: "sql/*.sql"
    gen:
      go:
        package: "querier"
        out: "internal/db"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: false
        emit_empty_slices: true
        overrides:
          - db_type: "bytea"
            go_type: "[]byte"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "text"
            go_type: "string"