services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      KITERAIL_LISTEN_ADDR: ":8080"
      KITERAIL_POSTGRES_DSN: "postgres://kiterail:kiterail@postgres:5432/kiterail?sslmode=disable"
      KITERAIL_POLICY_DIR: "/app/policies"
      KITERAIL_LOG_LEVEL: "info"
      KITERAIL_API_KEYS: "sk_dev_123:agent_1"
      KITERAIL_TARGET_URL: "http://echo-target:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  echo-target:
    image: mendhak/http-https-echo:latest
    environment:
      HTTP_PORT: 8081
    ports:
      - "8081:8081"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kiterail
      POSTGRES_PASSWORD: kiterail
      POSTGRES_DB: kiterail
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiterail"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
