services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ELODEA_LISTEN_ADDR: ":8080"
      ELODEA_POSTGRES_DSN: "postgres://elodea:elodea@postgres:5432/elodea?sslmode=disable"
      ELODEA_POLICY_DIR: "/app/policies"
      ELODEA_LOG_LEVEL: "info"
      ELODEA_API_KEYS: "sk_agent_local_000000000000:agent_1"
      ELODEA_REVIEWER_API_KEYS: "sk_reviewer_local_00000000:reviewer_1"
      ELODEA_TARGET_URL: "http://echo-target:8081"
      ELODEA_POLICY_RELOAD_INTERVAL: "10s"
    # Local development only: these credentials are deliberately fake.
    healthcheck:
      test: ["CMD", "/usr/local/bin/elodea", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    # The image ships the policies/ bundle. To iterate on policies locally,
    # uncomment the mount (requires Docker file sharing for this drive); the
    # proxy hot-reloads changes within ELODEA_POLICY_RELOAD_INTERVAL.
    # volumes:
    #   - ./policies:/app/policies:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  echo-target:
    image: mendhak/http-https-echo:37
    environment:
      HTTP_PORT: 8081
    ports:
      - "8081:8081"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elodea
      POSTGRES_PASSWORD: elodea
      POSTGRES_DB: elodea
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elodea"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
